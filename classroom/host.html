  <div class="su-modal" id="peek" hidden role="dialog" aria-modal="true" aria-label="ตัวอย่างโจทย์">
    <div class="rpg-card">
      <div class="su-modal-head"><b id="peekTitle"></b><button type="button" class="btn-sec" data-close style="padding:6px 12px">✕ ปิด</button></div>
      <div class="su-meta" id="peekMeta"></div>
      <p class="su-modal-q" id="peekQ"></p>
      <div id="peekBoard"></div>
      <div class="su-modal-nav">
        <button type="button" class="btn-sec" id="peekPrev">◀ ข้อก่อน</button>
        <span id="peekPos" style="align-self:center;color:var(--mute);font-size:0.85rem"></span>
        <button type="button" class="btn-sec" id="peekNext">ข้อถัดไป ▶</button>
      </div>
    </div>
  </div>
  <div class="su-toast" id="toast" hidden></div>
