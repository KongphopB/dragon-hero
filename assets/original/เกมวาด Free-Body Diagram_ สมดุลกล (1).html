<!DOCTYPE html>
<html lang="th">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมวาด Free-Body Diagram: สมดุลกล</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14213d;--mute:#5b6779;--line:#d5dce6;--W:#2563eb;--N:#15803d;--R:#c2410c;--S:#a21caf;--P:#be185d;--Q:#0369a1;--T:#7e22ce;--U:#0e7490;--ok:#15803d;--bad:#b91c1c;--boxok:#bbf7d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:1.5rem;margin:6px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.9rem;gap:6px}
.lv{padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-weight:600}
.tmb{background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tbar{height:6px;background:var(--line);border-radius:3px;margin:6px 0;overflow:hidden}.tbar i{display:block;height:100%;width:100%}
.q{font-size:1rem;font-weight:600;margin:8px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
.tags span{border:1px solid var(--line);border-radius:6px;padding:1px 8px}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.bx{fill:var(--card);transition:fill .35s}.bo{fill:var(--card)}svg.key .bx{fill:var(--boxok)}
#lay{transition:opacity .2s}
.vws{display:flex;gap:6px;margin:6px 0}
.vws button{flex:1;font:inherit;font-weight:600;font-size:.85rem;padding:8px 4px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.vws button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pal button{font:inherit;font-weight:600;font-size:.9rem;padding:11px 6px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.pal button.on{color:#fff}
.ghost{position:fixed;z-index:9;pointer-events:none;transform:translate(-50%,-130%);color:#fff;font-weight:800;padding:10px 14px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.hint{font-size:.9rem;color:var(--mute);margin:8px 0}
.row{display:flex;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:800;padding:13px 16px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;flex:1}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);flex:0 0 auto}
button:focus-visible{outline:3px solid var(--W);outline-offset:2px}
.fb{border-left:6px solid var(--bad)}.fb.good{border-left-color:var(--ok)}
.fb ul{padding-left:0;list-style:none;margin:6px 0}
.big{font-size:3rem;font-weight:800;margin:0}
.mon{position:relative}
.arena{display:flex;justify-content:space-between;align-items:flex-end;height:108px;overflow:hidden;padding:0 4px}
.pl,.mo{position:relative;width:96px;text-align:center}
.pl svg,.mo svg{width:96px;height:80px;display:block}
.hr{font-size:.85rem;letter-spacing:2px;height:22px}
.mi{margin-top:6px}.mn{font-weight:800}.ms{font-size:.85rem;color:var(--mute)}
.hpb{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0}.hpb i{display:block;height:100%;background:var(--bad);transition:width .7s .5s}
.dmg{position:absolute;left:0;right:0;top:-2px;font-weight:800;font-size:1.5rem;color:var(--bad);pointer-events:none;animation:fly 1.2s .35s ease-out both;text-shadow:0 1px 0 var(--card)}
@keyframes fly{0%{opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes lunge{0%,100%{transform:none}35%,60%{transform:translateX(90px)}}
@keyframes mlunge{0%,100%{transform:none}35%,60%{transform:translateX(-90px)}}
@keyframes shk{0%,100%{transform:none;filter:none}15%,55%{transform:translateX(8px) rotate(4deg);filter:sepia(1) saturate(7) hue-rotate(-40deg)}35%,75%{transform:translateX(-8px) rotate(-4deg);filter:sepia(1) saturate(7) hue-rotate(-40deg)}}
@keyframes flash{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.5)}}
.atk .pl svg{animation:lunge .8s}.atk .mo svg{animation:shk .6s .3s}
.hurt .mo svg{animation:mlunge .8s}.hurt .pl svg{animation:shk .6s .3s}
.atk .mo:before,.hurt .pl:before{content:"\1F4A5";position:absolute;left:34px;top:24px;font-size:2rem;z-index:2;animation:flash .5s .3s both}
.dead .mo svg{opacity:.3;transform:translateY(10px) rotate(20deg) scale(.7)}
.pdead .pl svg,.pdd svg{opacity:.3;transform:translateY(10px) rotate(-85deg) scale(.7)}
@keyframes mkill{0%,25%{opacity:1;transform:none;filter:none}35%,55%{transform:translateX(8px) rotate(4deg);filter:sepia(1) saturate(7) hue-rotate(-40deg)}45%{transform:translateX(-8px) rotate(-4deg);filter:sepia(1) saturate(7) hue-rotate(-40deg)}70%{opacity:1;transform:none;filter:none}100%{opacity:.3;transform:translateY(10px) rotate(20deg) scale(.7)}}
@keyframes pkill{0%,25%{opacity:1;transform:none;filter:none}35%,55%{transform:translateX(8px) rotate(4deg);filter:sepia(1) saturate(7) hue-rotate(-40deg)}45%{transform:translateX(-8px) rotate(-4deg);filter:sepia(1) saturate(7) hue-rotate(-40deg)}70%{opacity:1;transform:none;filter:none}100%{opacity:.3;transform:translateY(10px) rotate(-85deg) scale(.7)}}
.dead.atk .mo svg{animation:mkill 1.5s both}.pdead.hurt .pl svg{animation:pkill 1.5s both}
@media (prefers-reduced-motion:reduce){.atk .pl svg,.atk .mo svg,.hurt .mo svg,.hurt .pl svg,.dead.atk .mo svg,.pdead.hurt .pl svg,.dmg,.atk .mo:before,.hurt .pl:before{animation:none}.dmg{opacity:1}}
.hide{display:none}
</style>
